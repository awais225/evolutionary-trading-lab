[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hero1-api"
version = "1.1.0"
description = "Hero1 FastAPI service (Phase 1 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "hero1-storage>=1.0.0",
    "hero1-eventbus>=1.0.0",
    "hero1-ai-orchestrator>=1.0.0",
    "hero1-mt5-adapter>=0.1.0",
    "hero1-market-data>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
