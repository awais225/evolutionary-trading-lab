name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages (editable) + dev deps
        run: |
          python -m pip install -U pip
          python -m pip install -e packages/storage -e packages/eventbus -e packages/ai_orchestrator \
            -e packages/strategy_spec -e packages/exec_semantics -e packages/indicators \
            -e packages/mt5_adapter -e packages/research -e services/api -r requirements-dev.txt
      - name: Tests (synthetic temp DATA only)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm --prefix apps/web ci || npm --prefix apps/web install
      - name: Type-check + build
        run: |
          npm --prefix apps/web run build
      - name: Unit tests
        run: npm --prefix apps/web test -- --run
